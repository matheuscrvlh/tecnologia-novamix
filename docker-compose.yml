services:
  server:
    build: ./server
    container_name: tecnologia-server
    ports:
      - "3006:3000"
    env_file:
      - ./server/.env
    environment:
      SERVER_PORT: "3000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:?Defina a variável VITE_API_URL antes de buildar}
    container_name: tecnologia-client
    ports:
      - "8086:80"
    restart: unless-stopped
